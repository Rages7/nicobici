<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nicobici — Crear Cuenta Administrador</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
body {
  background: radial-gradient(circle at top right, #f8fafc 0%, #e2e8f0 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.register-card {
  width: 100%;
  max-width: 480px;
  background: #fff;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  padding: 32px;
}
</style>
</head>
<body>

<div class="register-card">
  <div style="text-align:center;margin-bottom:20px">
    <div class="logo-mark" style="width:52px;height:52px;font-size:20px;margin:0 auto 12px;border-radius:14px">NB</div>
    <h2 style="font-size:22px;font-weight:900;letter-spacing:-0.03em">Crear Cuenta de Dueño</h2>
    <div class="muted" style="font-size:13px;margin-top:4px">Acceso total al panel de administración</div>
  </div>

  <div id="msgAuth" style="margin-bottom:12px"></div>
  <div id="msg"></div>

  <form id="f" class="form-row" style="margin-top:12px">
    <label>Nombre y Apellido
      <input name="nombre" required placeholder="Ej: Nicolás Gómez" maxlength="60"/>
    </label>
    <label>Correo Electrónico
      <input name="email" type="email" required placeholder="dueno2@nicobici.local"/>
    </label>
    <label>Domicilio / Dirección (opcional)
      <input name="direccion" placeholder="Ej: Av. San Martín 1234, Ciudad" maxlength="100"/>
    </label>
    <label>Teléfono de Contacto (opcional)
      <input name="telefono" placeholder="Ej: 11-4000-1000" maxlength="30"/>
    </label>
    <label>Contraseña de Acceso (mínimo 6 caracteres)
      <input name="password" type="password" required minlength="6" placeholder="••••••••"/>
    </label>

    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:14px;font-weight:700;margin-top:8px">
      ✓ Registrar Cuenta de Dueño
    </button>
  </form>

  <div style="margin-top:16px;padding:12px;background:var(--surface-2);border-radius:var(--radius);font-size:11px" class="muted">
    ℹ️ Los clientes comerciales no requieren registro aquí: se gestionan directamente desde el módulo <a href="/usuarios.html"><b>Clientes</b></a>.
  </div>

  <div style="text-align:center;margin-top:16px;font-size:12px">
    <a href="/login.html" style="font-weight:600">← Volver al inicio de sesión</a>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
async function check() {
  const me = await fetch('/api/auth/me').then(x => x.json()).then(j => j.user).catch(() => null);
  const box = document.getElementById('msgAuth');
  if (!me) {
    box.innerHTML = '<div class="alert alert-warn" style="font-size:11px">Si aún no hay administradores creados, puedes registrar el primero libremente.</div>';
  } else {
    box.innerHTML = `<div class="alert alert-ok" style="font-size:11px">Sesión actual: <b>${esc(me.nombre)}</b> (${esc(me.email)})</div>`;
  }
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target).entries());
  const r = await fetch('/api/auth/registro', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(x => x.json()).catch(() => ({ ok: false, error: 'Error de conexión' }));

  if (!r.ok) {
    document.getElementById('msg').innerHTML = `<div class="alert alert-err">${esc(r.error)}</div>`;
    return;
  }

  showToast('¡Cuenta creada correctamente! Redirigiendo...', 'success');
  document.getElementById('msg').innerHTML = `<div class="alert alert-ok">Dueño creado: <b>${esc(r.user.email)}</b></div>`;
  setTimeout(() => {
    location.href = '/login.html';
  }, 1000);
});

check();
</script>
</body>
</html>
